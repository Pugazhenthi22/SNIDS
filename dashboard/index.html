<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNIDS — Live Dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">🛡</div>
      <div>
        <h1>SNIDS</h1>
        <span>Smart Network Intrusion Detection System</span>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat-card">
        <div class="stat-icon">📡</div>
        <div>
          <div class="stat-value" id="totalFlows">0</div>
          <div class="stat-label">Total Flows</div>
        </div>
      </div>
      <div class="stat-card benign">
        <div class="stat-icon">✓</div>
        <div>
          <div class="stat-value" id="benignCount">0</div>
          <div class="stat-label">Benign</div>
        </div>
      </div>
      <div class="stat-card attack">
        <div class="stat-icon">⚠</div>
        <div>
          <div class="stat-value" id="attackCount">0</div>
          <div class="stat-label">Attacks</div>
        </div>
      </div>
      <div class="stat-card rate">
        <div class="stat-icon">%</div>
        <div>
          <div class="stat-value" id="attackRate">0%</div>
          <div class="stat-label">Attack Rate</div>
        </div>
      </div>
      <div class="stat-card severity">
        <div class="stat-icon">🚨</div>
        <div>
          <div class="stat-value" id="highSeverity">0</div>
          <div class="stat-label">High Severity</div>
        </div>
      </div>
    </section>

    <section class="charts-row">
      <div class="panel chart-panel">
        <h2>Traffic Timeline</h2>
        <canvas id="timelineChart" height="90"></canvas>
      </div>

      <div class="panel side-panel">
        <h2>Severity Split</h2>
        <canvas id="severityChart" height="140"></canvas>

        <h2 class="second-heading">Top Source IPs</h2>
        <div id="topSources" class="top-sources">
          <div class="empty">No data yet.</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Live Alert Feed</h2>
      <table id="alertsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Prediction</th>
            <th>Severity</th>
            <th>Source IP</th>
            <th>Destination IP</th>
            <th>Packets</th>
          </tr>
        </thead>
        <tbody id="alertsBody">
          <tr><td colspan="6" class="empty">Waiting for data...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
